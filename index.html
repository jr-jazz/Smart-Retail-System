<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Smart Shelf Control Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans p-8">

    <div class="max-w-6xl mx-auto bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-2xl flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold tracking-tight text-emerald-400">SMART SHELF INVENTORY ANALYSIS</h1>
            <p class="text-sm text-slate-400 mt-1">Backend Infrastructure Hub: Python Server Core & MySQL Server Instancing</p>
        </div>
        <div class="text-right">
            <span id="connStatus" class="px-4 py-2 rounded-full text-xs font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30">
                ESTABLISHING MYSQL HANDSHAKE...
            </span>
        </div>
    </div>

    <div class="max-w-6xl mx-auto mt-8 grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-lg">
            <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Live Weight Readout</p>
            <p id="liveMass" class="text-5xl font-black text-emerald-400 mt-2">0.00 <span class="text-xl font-normal text-slate-400">kg</span></p>
        </div>
        <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-lg">
            <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Stack Volume Height</p>
            <p id="liveHeight" class="text-5xl font-black text-cyan-400 mt-2">0.0 <span class="text-xl font-normal text-slate-400">cm</span></p>
        </div>
        <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-lg">
            <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Node Security State</p>
            <p id="liveStatus" class="text-4xl font-black text-slate-400 mt-3">STANDBY</p>
        </div>

        <div class="md:col-span-3 bg-slate-900 p-6 rounded-xl border border-slate-800 h-96 relative shadow-xl">
            <h2 class="text-lg font-bold mb-4 text-slate-300">Continuous Relational MySQL Telemetry Stream</h2>
            <div class="absolute inset-x-6 top-16 bottom-6">
                <canvas id="sqlStreamChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('sqlStreamChart').getContext('2d');
        const statusBadge = document.getElementById('connStatus');
        
        const telemetryChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Live Shelf Mass Tracking (kg)',
                    data: [],
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.05)',
                    borderWidth: 3,
                    tension: 0.2,
                    pointRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { color: '#1e293b' }, ticks: { color: '#64748b' } },
                    y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b' } }
                }
            }
        });

        // Instantiate live connection to local Python listener port
        const socket = new WebSocket('ws://localhost:8765');

        socket.onopen = () => {
            statusBadge.innerText = "MYSQL DATABASE CONNECTED";
            statusBadge.className = "px-4 py-2 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
        };

        socket.onclose = () => {
            statusBadge.innerText = "LOCAL SERVER OFFLINE";
            statusBadge.className = "px-4 py-2 rounded-full text-xs font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30";
        };

        // Render data packets directly into the charts automatically
        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);

            document.getElementById('liveMass').innerHTML = `${data.mass_kg.toFixed(2)} <span class="text-xl font-normal text-slate-400">kg</span>`;
            document.getElementById('liveHeight').innerHTML = `${data.height_cm.toFixed(1)} <span class="text-xl font-normal text-slate-400">cm</span>`;
            
            const statusEl = document.getElementById('liveStatus');
            statusEl.innerText = data.status;
            if(data.status === "ALARM" || data.status === "LOW STOCK") {
                statusEl.className = "text-4xl font-black text-rose-500 mt-3 animate-pulse";
            } else {
                statusEl.className = "text-4xl font-black text-emerald-400 mt-3";
            }

            const timeLabel = data.timestamp.split(" ")[1]; // extract HH:MM:SS
            if (telemetryChart.data.labels.length > 15) {
                telemetryChart.data.labels.shift();
                telemetryChart.data.datasets[0].data.shift();
            }

            telemetryChart.data.labels.push(timeLabel);
            telemetryChart.data.datasets[0].data.push(data.mass_kg);

            // Re-render layout canvas dynamically with no refresh
            telemetryChart.update('none');
        };
    </script>
</body>
</html>
